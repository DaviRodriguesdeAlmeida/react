name: Build Treino Mission Android

on:
  push:
    branches:
      - build-treino-mission-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source archive
        shell: bash
        run: |
          set -euo pipefail
          cat treino-mission-build/part_00.b64 treino-mission-build/part_01.b64 | tr -d '[:space:]' | base64 -d > /tmp/treino-mission-android.zip
          echo "bdb40fea3b37cab00f69cbc7b29ec363d3ab579def4c22bde5e188f88003c894  /tmp/treino-mission-android.zip" | sha256sum -c -
          mkdir -p /tmp/treino-mission-src
          unzip -q /tmp/treino-mission-android.zip -d /tmp/treino-mission-src
          echo "PROJECT_DIR=/tmp/treino-mission-src/android-build-min" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/Treino-Mission-v1.0-Android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Mission-v1.0-Android
          path: ${{ runner.temp }}/Treino-Mission-v1.0-Android.apk
          if-no-files-found: error
          retention-days: 7
